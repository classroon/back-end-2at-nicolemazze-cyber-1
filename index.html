<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Minha Conexão Back-End</h1>
<button onclick="buscarDados()">Clique para chamar o Servidor</button>
<p id="resposta">Aguardando comando...</p>

<script>
  async function buscarDados() {
    try {
      const resposta = await fetch('https://scaling-space-guide-jxw9q5pvjrw3pj4x-3000.app.github.dev/mensagem');
      
      const dados = await resposta.json();

      document.getElementById('resposta').innerText = dados.texto;
    } catch (erro) {
      console.error(erro);
      document.getElementById('resposta').innerText = 'Erro ao buscar dados';
    }
  }
</script>
</body>
</html>
